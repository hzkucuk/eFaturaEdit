name: release

# Sürüm etiketi (ör. v2.14.0) push edilince 3 platformda derleyip GitHub
# Release olarak yayınlar. macOS'tan Windows/Linux cross-compile mümkün
# olmadığından her platform kendi runner'ında derlenir.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # native-image evrensel (universal) ikili üretemediğinden macOS iki
        # mimariye ayrılır; her runner kendi mimarisi için sidecar + app derler.
        include:
          - platform: macos-14 # Apple Silicon (arm64)
            args: ''
          # Intel macOS: `macos-13` emekliye ayrıldı — iş sonsuza dek kuyrukta
          # bekliyordu (runner hiç atanmıyor). Yerini `macos-15-intel` aldı.
          - platform: macos-15-intel # Intel (x86_64)
            args: ''
          - platform: ubuntu-22.04 # x86_64 — geniş glibc uyumu için 22.04
            args: ''
          # Linux ARM64: Apple Silicon üzerindeki VM'ler (VMware/Parallels/UTM)
          # yalnızca ARM64 misafir çalıştırır; x86_64 paketlerimiz orada ÇALIŞMAZ.
          # Ayrıca ARM sunucular, Raspberry Pi ve Asahi Linux da bunu kullanır.
          # (GraalVM native-image Linux/AArch64'ü DESTEKLER — Windows/ARM64'ü
          # desteklemiyordu; bu yüzden orada sidecar üretemiyoruz.)
          - platform: ubuntu-22.04-arm # aarch64
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux bağımlılıkları
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            xdg-utils
          # xdg-utils: ARM64 runner imajında YOK (x64'te hazır geliyor) ve
          # AppImage paketlemesi `xdg-open`e ihtiyaç duyuyor — yoksa
          # "failed to bundle project: xdg-open binary not found" ile çöker.

      # WiX, MSI dizesini code page 1252 (Latin-1) ile yazar; Türkçe'nin
      # ş/Ş/ı/İ/ğ/Ğ harfleri bu kod sayfasında YOKTUR. fileAssociations
      # açıklamalarında bunlar geçerse `light.exe` LGHT0311 ile çöker ve
      # Windows paketi hiç üretilmez (v2.21.0'da başımıza geldi). Burada
      # saniyesinde yakala — 20 dakikalık derlemenin sonunda değil.
      - name: MSI kod sayfası kontrolü (CP1252)
        shell: python
        run: |
          import json, sys
          cfg = json.load(open('app/src-tauri/tauri.conf.json', encoding='utf-8'))
          bad = []
          strings = [('productName', cfg['productName'])]
          for a in cfg.get('bundle', {}).get('fileAssociations', []):
              strings.append(('fileAssociations.description', a['description']))
          for where, s in strings:
              try:
                  s.encode('cp1252')
              except UnicodeEncodeError as e:
                  bad.append(f"{where}: {s!r} — CP1252 disi karakter: {s[e.start:e.end]!r}")
          if bad:
              print('MSI paketleme bu dizelerde cokecek (WiX LGHT0311):')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('CP1252 kontrolu tamam.')

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      # XSLT 2.0/3.0 sidecar'ı (Saxon-HE native binary) — Windows'ta MSVC
      # ortamını da bu action kurar.
      - name: GraalVM kur
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: XSLT sidecar derle (Saxon-HE native-image)
        shell: bash
        run: bash build.sh
        working-directory: ./sidecar

      - name: Frontend bağımlılıkları
        run: npm ci
        working-directory: ./app

      # Sürüm notları CHANGELOG'dan gelsin. Bu metin hem GitHub Release'de hem de
      # kullanıcının gördüğü GÜNCELLEME PENCERESİNDE (latest.json → notes) çıkar;
      # sabit bir şablon metni orada "neyin değiştiği"ni anlatmaz.
      - name: Sürüm notlarını CHANGELOG'dan çıkar
        id: notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md | sed '/^---$/d')
          # CHANGELOG'da o sürümün girdisi yoksa boş nota düşme.
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="e-Fatura Edit ${GITHUB_REF_NAME}"
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$BODY"
            echo ''
            echo '---'
            echo ''
            echo '**Kurulum:** Windows `.msi` / `.exe` · macOS `.dmg` (Apple Silicon + Intel) · Linux `.deb` / `.rpm` / `.AppImage` (x86_64 + **arm64**)'
            echo ''
            echo 'Tam XSLT 1.0/2.0/3.0 desteği (Saxon-HE motoru dahili).'
            echo ''
            echo '### ⚠️ macOS: "hasar görmüş olduğu için açılamıyor" uyarısı'
            echo ''
            echo 'Uygulama **bozuk değildir.** Paketler henüz Apple Developer ID ile imzalanmadığından,'
            echo 'macOS tarayıcıyla indirilen dosyalara taktığı *karantina* bayrağı yüzünden bu yanıltıcı'
            echo 'mesajı gösterir. Uygulamayı `Applications` klasörüne sürükledikten sonra Terminal'"'"'de **bir kez**:'
            echo ''
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine "/Applications/e-Fatura Edit.app"'
            echo '```'
            echo ''
            echo 'Sonrasında normal açılır. Otomatik güncellemeler bu adımı gerektirmez.'
            echo ''
            echo 'Windows'"'"'ta SmartScreen uyarısı çıkarsa: **Daha fazla bilgi → Yine de çalıştır**.'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Derle & Release yayınla
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Otomatik güncelleme imzası. Uygulama, güncellemeyi yalnızca bu
          # anahtarla imzalanmışsa kabul eder (pubkey tauri.conf'ta gömülü).
          # Anahtar kaybolursa kurulu uygulamalara bir daha güncelleme
          # gönderilemez — yedeği ~/.tauri/efaturaedit.key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./app
          tagName: ${{ github.ref_name }}
          # ⚠️ KAPALI OLMALI (v2.33.2). Açıkken HER matris işi latest.json'u
          # release'e yüklüyordu: işler paralel koştuğu için biri diğerinin
          # yazdığını EZİYOR (oku-değiştir-yaz yarışı). v2.33.1'de tam da bu oldu —
          # latest.json 15 yerine 9 platformla çıktı; darwin-aarch64 (Apple Silicon)
          # ve linux-aarch64 kayboldu. Ürünler release'te duruyordu ama updater
          # onları görmüyordu: o platformlardaki kullanıcılar güncellemeyi HİÇ
          # GÖRMEZ, hata da almaz. (Aynı yarış "ReleaseAsset already_exists"
          # hatasını da üretti.)
          # Manifest artık matris bittikten SONRA, tek elden `verify` işinde
          # üretiliyor — yarışacak kimse kalmıyor.
          includeUpdaterJson: false
          releaseName: 'e-Fatura Edit ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          # ⚠️ TASLAK OLMALI (v2.33.3). `tauri-action` release'i derlemenin
          # BAŞINDA oluşturuyor. Taslak DEĞİLSE, yeni sürüm o an "latest" olur ama
          # `latest.json`'u ancak ~30 dk sonra `verify` yükler → o aralıkta
          # `/latest/download/latest.json` = 404: kullanıcı güncellemeyi göremez.
          # Taslak tutulunca `/latest` derleme boyunca ESKİ SAĞLAM sürümü gösterir;
          # `verify` manifesti üretip DOĞRULADIKTAN sonra yayınlar → geçiş ATOMİK,
          # ya tam ya hiç. (Taslaktan `gh release download` çalışıyor — ölçüldü.)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ───────────────────────────────────────────────────────────────────────
  # YAYIN DOĞRULAMA — bu iş olmadan eksik bir sürüm SESSİZCE yayınlanabilir.
  #
  # v2.27.3'te tam olarak bu oldu: macos-14 işi GitHub'ın geçici bir altyapı
  # hatasıyla ("Failed to resolve action download info") daha derlemeye
  # başlamadan düştü; diğer dört iş yeşil geçti, release YAYINLANDI ve
  # latest.json 15 yerine 13 platformla çıktı. Apple Silicon kullanıcıları
  # güncellemeyi hiç görmedi, hata da almadı. Elle bakılmasaydı fark
  # edilmeyecekti (bu projede aynı sınıf hata dört sürüm boyunca gizlenmişti).
  #
  # Kural: bir işin bittiğini varsayma, ÇIKTISINI SAY.
  # ───────────────────────────────────────────────────────────────────────
  verify:
    needs: release
    if: always() # release düşse de çalış — asıl amaç düşüşü GÖRÜNÜR kılmak
    runs-on: ubuntu-22.04
    steps:
      - name: Matris işleri başarılı mı?
        if: needs.release.result != 'success'
        run: |
          echo "::error::Derleme matrisi '${{ needs.release.result }}' ile bitti — en az bir platform üretilmedi."
          echo "Release yayınlanmış olabilir ama EKSİKTİR. Düşen işi yeniden çalıştırın:"
          echo "  gh run rerun <run-id> --failed"
          exit 1

      # ───────────────────────────────────────────────────────────────────
      # Manifesti TEK ELDEN üret (v2.33.2). Eskiden bunu her matris işi
      # yapıyordu ve birbirlerinin yazdığını eziyorlardı (bkz. includeUpdaterJson).
      #
      # Kaynak: release'teki GERÇEK varlıklar ve GERÇEK .sig dosyaları. İmza
      # uydurulmaz, dosya adı tahmin edilmez — ne yüklendiyse o okunur.
      # 15 girdinin tamamı kurulamıyorsa manifest YAZILMAZ ve iş kırmızıya döner:
      # eksik bir manifest, "bazı kullanıcıya güncelleme var, bazısına sessizce
      # yok" demektir — hiç manifest olmamasından beterdir.
      # ───────────────────────────────────────────────────────────────────
      - name: latest.json'u release varlıklarından üret (yarışsız)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf manifest && mkdir manifest && cd manifest

          # İmzalar TASLAK release'ten indirilir (tauri her ürün için .sig üretti).
          # `gh release download` taslakta çalışıyor — ölçüldü (v2.33.3).
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig'
          # publishedAt TASLAKTA null döner (ölçüldü) → createdAt'e düşülür, yoksa
          # manifestin pub_date'i null olur. (Updater kararı sürüme bakar, pub_date
          # yalnızca gösterim; ama null yazmak yerine gerçek oluşturma zamanı yeğ.)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,publishedAt,createdAt > meta.json

          python3 - <<'PY'
          import json, os, re, sys, pathlib

          tag  = os.environ['TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          base = f"https://github.com/{repo}/releases/download/{tag}"

          # Ürün dosyası deseni → updater platform anahtar(lar)ı.
          # (Takma adlar dahil 15 anahtar: macOS ×4, Linux ×8, Windows ×3.)
          RULES = [
              (r'_aarch64\.app\.tar\.gz$', ['darwin-aarch64', 'darwin-aarch64-app']),
              (r'_x64\.app\.tar\.gz$',     ['darwin-x86_64',  'darwin-x86_64-app']),
              (r'_aarch64\.AppImage$',     ['linux-aarch64',  'linux-aarch64-appimage']),
              (r'_arm64\.deb$',            ['linux-aarch64-deb']),
              (r'\.aarch64\.rpm$',         ['linux-aarch64-rpm']),
              (r'_amd64\.AppImage$',       ['linux-x86_64',   'linux-x86_64-appimage']),
              (r'_amd64\.deb$',            ['linux-x86_64-deb']),
              (r'\.x86_64\.rpm$',          ['linux-x86_64-rpm']),
              (r'_x64_en-US\.msi$',        ['windows-x86_64', 'windows-x86_64-msi']),
              (r'_x64-setup\.exe$',        ['windows-x86_64-nsis']),
          ]
          EXPECTED = 15

          platforms = {}
          for sig in sorted(pathlib.Path('.').glob('*.sig')):
              asset = sig.name[:-4]                      # ".sig" ekini at → ürün dosyası
              signature = sig.read_text().strip()
              if not signature:
                  print(f"::error::İmza dosyası boş: {sig.name}")
                  sys.exit(1)
              for pattern, keys in RULES:
                  if re.search(pattern, asset):
                      for k in keys:
                          platforms[k] = {"signature": signature, "url": f"{base}/{asset}"}
                      break
              else:
                  print(f"  (eşleşmeyen varlık, atlandı: {asset})")

          meta = json.load(open('meta.json'))
          manifest = {
              "version":   tag.lstrip('v'),
              "notes":     meta.get('body') or f"e-Fatura Edit {tag}",
              # Taslakta publishedAt null → createdAt (ölçüldü, v2.33.3).
              "pub_date":  meta.get('publishedAt') or meta.get('createdAt'),
              "platforms": platforms,
          }

          print(f"üretilen platform sayısı: {len(platforms)} (beklenen {EXPECTED})")
          for k in sorted(platforms):
              print(f"  - {k}")

          if len(platforms) != EXPECTED:
              missing = EXPECTED - len(platforms)
              print(f"::error::latest.json {len(platforms)} platformla kurulabildi, {EXPECTED} bekleniyordu "
                    f"({missing} eksik). Manifest YAZILMADI — eksik manifest, o platformdaki kullanıcılara "
                    "güncellemeyi SESSİZCE göstermez. Düşen işi yeniden çalıştırın: gh run rerun <id> --failed")
              sys.exit(1)

          json.dump(manifest, open('latest.json', 'w'), indent=2, ensure_ascii=False)
          PY

          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      # Yukarıda ürettik diye doğru olduğunu VARSAYMA — release'te CANLI duran
      # dosyayı indirip say (ders 1: bir işin bittiğini varsayma, çıktısını doğrula).
      - name: latest.json — 15 platform, hepsi imzalı mı?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json --clobber

          python3 - <<'PY'
          import json, os, sys

          # macOS ×2 · Windows ×3 · Linux x86_64 ×4 · Linux arm64 ×4 + 2 takma ad
          EXPECTED = 15

          d = json.load(open('latest.json'))
          platforms = d.get('platforms', {})
          unsigned = [k for k, v in platforms.items() if not v.get('signature')]

          print(f"sürüm   : {d.get('version')}")
          print(f"platform: {len(platforms)} (beklenen {EXPECTED})")
          for k in sorted(platforms):
              print(f"  - {k}")

          fail = False
          if len(platforms) != EXPECTED:
              print(f"::error::latest.json {len(platforms)} platform içeriyor, {EXPECTED} bekleniyordu. "
                    "Eksik platformdaki kullanıcılar güncellemeyi HİÇ GÖRMEZ.")
              fail = True
          if unsigned:
              print(f"::error::İmzasız platform girdileri: {unsigned}. Updater imzasız güncellemeyi reddeder.")
              fail = True

          sys.exit(1 if fail else 0)
          PY

      # Buraya ancak manifest üretimi (15 platform) VE taslaktaki manifestin canlı
      # doğrulaması (15 + imzalı) GEÇTİYSE gelinir. Artık yayınlamak GÜVENLİ:
      # latest.json zaten yüklü, dolayısıyla taslaktan çıkış ANINDA /latest hem yeni
      # sürümü hem TAM manifesti gösterir — geçiş atomik, ya tam ya hiç.
      # Doğrulama düşerse buraya hiç gelinmez → release TASLAK kalır, /latest eski
      # sağlam sürümü göstermeye devam eder (fail-closed: kimse bozuk güncelleme almaz).
      - name: Doğrulama geçti → release'i yayınla (taslaktan çıkar)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "✓ Taslaktan yayına alındı."

      # Yayınladık diye canlı olduğunu VARSAYMA — son kez doğrula (ders 1).
      - name: Yayın gerçekten canlı mı? (taslak değil)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "false" ]; then
            echo "::error::Release hâlâ taslak — yayınlama başarısız, güncelleme akışı sessizce durur."
            exit 1
          fi
          echo "✓ Yayın tam ve canlı: 15 imzalı platform, taslak değil."
