name: release

# Sürüm etiketi (ör. v2.14.0) push edilince 3 platformda derleyip GitHub
# Release olarak yayınlar. macOS'tan Windows/Linux cross-compile mümkün
# olmadığından her platform kendi runner'ında derlenir.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # native-image evrensel (universal) ikili üretemediğinden macOS iki
        # mimariye ayrılır; her runner kendi mimarisi için sidecar + app derler.
        include:
          - platform: macos-14 # Apple Silicon (arm64)
            args: ''
          - platform: macos-13 # Intel (x86_64)
            args: ''
          - platform: ubuntu-22.04 # geniş glibc uyumu için 22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux bağımlılıkları
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      # XSLT 2.0/3.0 sidecar'ı (Saxon-HE native binary) — Windows'ta MSVC
      # ortamını da bu action kurar.
      - name: GraalVM kur
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: XSLT sidecar derle (Saxon-HE native-image)
        shell: bash
        run: ./build.sh
        working-directory: ./sidecar

      - name: Frontend bağımlılıkları
        run: npm ci
        working-directory: ./app

      - name: Derle & Release yayınla
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./app
          tagName: ${{ github.ref_name }}
          releaseName: 'e-Fatura Edit ${{ github.ref_name }}'
          releaseBody: |
            e-Fatura Edit ${{ github.ref_name }} — otomatik derlenmiş kurulum paketleri.

            - **Windows:** `.msi` / `.exe` (NSIS)
            - **macOS:** `.dmg` (Apple Silicon ve Intel için ayrı paketler)
            - **Linux:** `.deb` / `.rpm` / `.AppImage`

            Tam XSLT 1.0/2.0/3.0 desteği (Saxon-HE motoru dahili).

            > Not: Paketler kod imzasızdır; ilk açılışta işletim sistemi
            > "bilinmeyen geliştirici" uyarısı gösterebilir.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
