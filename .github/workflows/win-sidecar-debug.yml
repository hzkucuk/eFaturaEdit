name: win-sidecar-debug

# GEÇİCİ teşhis. Windows'ta Saxon sidecar'ı çalışmıyor: uygulama ona veri
# yazarken "Boru sonlandı (os error 109)" alıyor — yani süreç anında ölüyor.
# Dosya paketin içinde VAR (46 MB, CI'da derleniyor), demek ki BAŞLAYAMIYOR.
#
# Bu iş iki şeyi ölçer:
#   1. exe hangi DLL'lere bağımlı (eksik VC++ runtime hipotezi)
#   2. exe gerçekten çalışıp XSLT dönüştürüyor mu (uçtan uca duman testi)
#
# Sorun çözülünce bu dosya silinecek.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: GraalVM kur
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: XSLT sidecar derle
        shell: bash
        run: bash build.sh
        working-directory: ./sidecar

      - name: 1) exe'nin DLL bağımlılıkları
        shell: pwsh
        run: |
          $exe = Get-ChildItem app/src-tauri/binaries/xslt-transform-*.exe | Select-Object -First 1
          Write-Host "exe: $($exe.FullName)  ($([math]::Round($exe.Length/1MB,1)) MB)"
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
            Write-Host "=== BAĞIMLI DLL'LER ==="
            & $dumpbin.FullName /dependents $exe.FullName | Select-String -Pattern "\.dll"
          } else {
            Write-Host "dumpbin bulunamadı"
          }

      - name: 2) sidecar duman testi (gerçekten dönüştürüyor mu?)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem app/src-tauri/binaries/xslt-transform-*.exe | Select-Object -First 1).FullName

          # Protokol: [4 bayt BE uzunluk][XSLT][4 bayt BE uzunluk][XML]
          $xslt = @'
          <?xml version="1.0" encoding="UTF-8"?>
          <xsl:stylesheet version="2.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform">
            <xsl:template match="/">
              <html><body><p>UPPER: <xsl:value-of select="upper-case(/root/name)"/></p></body></html>
            </xsl:template>
          </xsl:stylesheet>
          '@
          $xml = '<?xml version="1.0" encoding="UTF-8"?><root><name>merhaba</name></root>'

          $enc = [System.Text.Encoding]::UTF8
          $xsltB = $enc.GetBytes($xslt)
          $xmlB  = $enc.GetBytes($xml)
          $ms = New-Object System.IO.MemoryStream
          function WriteBE($stream, [int]$n) { $b = [BitConverter]::GetBytes($n); [Array]::Reverse($b); $stream.Write($b, 0, 4) }
          WriteBE $ms $xsltB.Length; $ms.Write($xsltB, 0, $xsltB.Length)
          WriteBE $ms $xmlB.Length;  $ms.Write($xmlB, 0, $xmlB.Length)
          $payload = $ms.ToArray()

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false

          $p = [System.Diagnostics.Process]::Start($psi)
          $stdin = $p.StandardInput.BaseStream
          $stdin.Write($payload, 0, $payload.Length)
          $stdin.Close()

          $out = $p.StandardOutput.ReadToEnd()
          $err = $p.StandardError.ReadToEnd()
          $p.WaitForExit()

          Write-Host "çıkış kodu: $($p.ExitCode)"
          Write-Host "=== STDOUT ==="; Write-Host $out
          Write-Host "=== STDERR ==="; Write-Host $err

          if ($p.ExitCode -ne 0) { throw "sidecar çıkış kodu $($p.ExitCode)" }
          if ($out -notmatch 'MERHABA') { throw "XSLT 2.0 (upper-case) çalışmadı — çıktı: $out" }
          Write-Host "✅ küçük yük: sidecar ÇALIŞIYOR ve XSLT 2.0 yapıyor"

      # KRİTİK: kullanıcının gerçek dosyası 600 KB XSLT + 173 KB XML. Küçük yükle
      # test etmek yanıltıcı olur — Windows'ta boru tamponu küçüktür ve hata
      # boyuta bağlı olabilir. Depodaki GERÇEK örnek şablonla tekrar sına.
      - name: 3) GERÇEK boyutlu yük (600 KB) — asıl senaryo
        shell: pwsh
        run: |
          $exe = (Get-ChildItem app/src-tauri/binaries/xslt-transform-*.exe | Select-Object -First 1).FullName
          $xsltPath = "app/static/samples/default.xslt"
          $xmlPath  = "app/static/samples/default.xml"
          $xsltB = [System.IO.File]::ReadAllBytes($xsltPath)
          $xmlB  = [System.IO.File]::ReadAllBytes($xmlPath)
          Write-Host "XSLT: $([math]::Round($xsltB.Length/1KB,1)) KB · XML: $([math]::Round($xmlB.Length/1KB,1)) KB"

          $ms = New-Object System.IO.MemoryStream
          function WriteBE($stream, [int]$n) { $b = [BitConverter]::GetBytes($n); [Array]::Reverse($b); $stream.Write($b, 0, 4) }
          WriteBE $ms $xsltB.Length; $ms.Write($xsltB, 0, $xsltB.Length)
          WriteBE $ms $xmlB.Length;  $ms.Write($xmlB, 0, $xmlB.Length)
          $payload = $ms.ToArray()
          Write-Host "toplam yük: $([math]::Round($payload.Length/1KB,1)) KB"

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)

          # stdout'u ayrı okumak ŞART: yazarken çocuk stdout'u doldurup bloke
          # olursa ve biz de yazmaya çalışırsak karşılıklı kilitlenme olur.
          $outTask = $p.StandardOutput.ReadToEndAsync()
          $errTask = $p.StandardError.ReadToEndAsync()

          try {
            $stdin = $p.StandardInput.BaseStream
            $stdin.Write($payload, 0, $payload.Length)
            $stdin.Flush()
            $stdin.Close()
          } catch {
            Write-Host "❌ STDIN YAZMA HATASI: $_"
          }

          $p.WaitForExit()
          $out = $outTask.Result
          $err = $errTask.Result
          Write-Host "çıkış kodu: $($p.ExitCode)"
          Write-Host "çıktı boyutu: $($out.Length) karakter"
          if ($err) { Write-Host "=== STDERR ==="; Write-Host $err }

          if ($p.ExitCode -ne 0) { throw "GERÇEK yükte sidecar çöktü (kod $($p.ExitCode))" }
          if ($out.Length -lt 1000) { throw "GERÇEK yükte çıktı boş/kısa: $($out.Length)" }
          Write-Host "✅ GERÇEK boyutlu yük de ÇALIŞIYOR ($($out.Length) karakter HTML)"
