[package]
name = "efatura-edit"
version = "2.30.1"
description = "E-Fatura Dizayn Editörü — Tauri + SvelteKit + Saxon-JS"
authors = ["Zafer Bilgisayar"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
# XSLT 2.0/3.0 sidecar'ını (Saxon-HE native binary) çalıştırmak için.
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# API anahtarlarını OS anahtar zincirinde (Keychain / Credential Manager /
# Secret Service) şifreli sakla. Linux'ta C bağımlılığı olmadan derlensin diye
# saf-Rust secret-service + RustCrypto backend'i seçilir.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-log = "2.8.0"
log = "0.4.33"
tauri-plugin-clipboard-manager = "2"

