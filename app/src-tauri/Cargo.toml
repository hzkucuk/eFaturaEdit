[package]
name = "efatura-edit"
version = "2.36.0"
description = "E-Fatura Dizayn Editörü — Tauri + SvelteKit + Saxon-JS"
authors = ["Zafer Bilgisayar"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
# XSLT 2.0/3.0 sidecar'ını (Saxon-HE native binary) çalıştırmak için.
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# API anahtarlarını OS anahtar zincirinde (Keychain / Credential Manager /
# Secret Service) şifreli sakla. Linux'ta C bağımlılığı olmadan derlensin diye
# saf-Rust secret-service + RustCrypto backend'i seçilir.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-log = "2.8.0"
log = "0.4.33"
tauri-plugin-clipboard-manager = "2"
# Claude Code motoru (agent_cli.rs): ikili npm registry'den indirilir ve
# AÇILMADAN ÖNCE sha512 ile doğrulanır (registry `dist.integrity`).
# Hepsi saf-Rust — çapraz derlemede C bağımlılığı getirmesin.
sha2 = "0.10"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
# Onay kapısı IPC'si (agent_hook.rs): Claude Code motorunun PreToolUse hook'u ayrı
# bir SÜREÇ olarak koşar ve kararı uygulamadan sormak zorundadır. std'de yalnızca
# UnixListener var — Windows named pipe YOK. Bu crate ikisini tek API'de veriyor:
# GenericFilePath (unix → UDS) / GenericNamespaced (Windows → named pipe).
# Saf-Rust (libc + widestring), C toolchain getirmez → çapraz derleme bozulmaz.
interprocess = "2.4.2"
# Faz D — "Terminal" sekmesi: ham interaktif `claude`'u gerçek bir PTY'de sürer
# (kendi TUI'si, kendi izin sistemi). ⚠️ Bu modda bizim fail-closed hook+sandbox
# garantimiz TUTMAZ (ölçüldü 2026-07-18: interaktif claude sandbox'ı kendi izin
# akışıyla atlıyor) — sekme AÇIKÇA "ham claude, klasör kilidi garanti değil" etiketli.
portable-pty = "0.9"

# Yalnızca unix: onay kapısına bağlanan sürecin gerçekten BİZ olduğumuzu doğrulamak
# için `geteuid()` (agent_hook::serve). Windows'ta karşılığı pipe ACL'i + FIRST_PIPE_INSTANCE.
[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
# Yalnızca test için (ürüne girmez): agent_cli'nin indirme/doğrulama çekirdeğini
# gerçek npm registry'ye karşı uçtan uca koşturmak için async runtime gerekiyor.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
